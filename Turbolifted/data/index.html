<!DOCTYPE html>
<html>
<head>
    <title>Turbolift Controller</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; padding: 16px; }
        .header {
            background: #2c2c2c;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            text-align: center;
        }
        .header h1 { margin: 0 0 4px; font-size: 1.4em; }
        .header p { margin: 0; font-size: 0.85em; color: #aaa; }
        .message {
            background: #4CAF50;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 12px;
            text-align: center;
            display: none;
            font-size: 0.9em;
        }
        /* Tabs */
        .tab-buttons { display: flex; margin-bottom: 16px; gap: 8px; }
        .tab-button {
            padding: 8px 18px;
            background: #333;
            color: #ccc;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .tab-button.active { background: #4CAF50; color: white; }
        .tab-button:hover:not(.active) { background: #3a3a3a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Sections */
        .section {
            background: #2c2c2c;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .section h2 { margin: 0 0 12px; font-size: 1em; color: #4CAF50; text-transform: uppercase; letter-spacing: 0.05em; }
        /* Preset buttons */
        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .preset {
            padding: 14px 10px;
            background: #3a3a3a;
            color: #ccc;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.15s;
        }
        .preset:hover { background: #444; }
        .preset.active { background: #1a3a1a; border-color: #4CAF50; color: #4CAF50; }
        /* Action buttons */
        .action-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn {
            flex: 1;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.15s;
        }
        .btn:hover { background: #45a049; }
        .btn.danger { background: #f44336; }
        .btn.danger:hover { background: #d32f2f; }
        .btn.warn { background: #ff9800; }
        .btn.warn:hover { background: #e68900; }
        /* Sliders */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85em; color: #ccc; }
        .form-group label span { color: #4CAF50; font-weight: bold; min-width: 2.5em; text-align: right; }
        input[type=range] { width: 100%; accent-color: #4CAF50; cursor: pointer; }
        /* Hue preview */
        .hue-preview { width: 100%; height: 20px; border-radius: 4px; margin-top: 6px; border: 1px solid #444; }
        /* Advanced collapsible */
        details { margin-top: 4px; }
        summary {
            cursor: pointer;
            color: #4CAF50;
            font-size: 0.85em;
            padding: 6px 0;
            user-select: none;
        }
        summary:hover { color: #80c080; }
        .advanced-grid { padding-top: 12px; }
        /* Device config */
        .device-row { display: flex; gap: 8px; align-items: flex-end; }
        .device-row input[type=text] {
            flex: 1;
            padding: 7px 10px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #1a1a1a;
            color: #fff;
            font-size: 0.9em;
        }
        .device-row .btn { flex: 0 0 auto; padding: 7px 14px; }
        small { color: #888; font-size: 0.78em; margin-top: 4px; display: block; }
        /* Status */
        .status-box { background: #2c2c2c; border-radius: 6px; padding: 16px; }
        .status-box pre { color: #ccc; font-size: 0.85em; white-space: pre-wrap; }
        .footer { text-align: center; padding: 10px; color: #555; font-size: 0.8em; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Turbolift Controller</h1>
        <p>TNG-style turbolift LED panel control</p>
    </div>
    <div id="message" class="message"></div>

    <div class="tab-buttons">
        <button class="tab-button active" onclick="showTab('main')">Main</button>
        <button class="tab-button" onclick="showTab('status')">Status</button>
    </div>

    <!-- MAIN TAB -->
    <div id="main" class="tab-content active">

        <!-- Device IP config -->
        <div class="section">
            <h2>Device</h2>
            <div class="device-row">
                <input type="text" id="device-ip" placeholder="192.168.1.100" value="">
                <button class="btn" onclick="setServer()">Connect</button>
            </div>
            <small id="server-status">Using current origin</small>
        </div>

        <!-- Preset buttons -->
        <div class="section">
            <h2>Presets</h2>
            <div class="preset-grid">
                <button class="preset active" id="preset-0" onclick="setPreset(0)">⬇ Moving Down</button>
                <button class="preset" id="preset-1" onclick="setPreset(1)">⬆ Moving Up</button>
                <button class="preset" id="preset-2" onclick="setPreset(2)">■ Stopped</button>
                <button class="preset" id="preset-3" onclick="setPreset(3)">◉ Pulse</button>
            </div>
        </div>

        <!-- Basic color controls -->
        <div class="section">
            <h2>Color &amp; Brightness</h2>
            <div class="form-group">
                <label>Hue <span id="hue-value">160</span></label>
                <input type="range" id="hue" min="0" max="255" value="160"
                    oninput="updateVal('hue'); updateHuePreview()"
                    onmouseup="liftSet('hue', this.value)"
                    ontouchend="liftSet('hue', this.value)">
                <canvas id="hue-preview" class="hue-preview"></canvas>
            </div>
            <div class="form-group">
                <label>Saturation <span id="saturation-value">255</span></label>
                <input type="range" id="saturation" min="0" max="255" value="255"
                    oninput="updateVal('saturation')"
                    onmouseup="liftSet('saturation', this.value)"
                    ontouchend="liftSet('saturation', this.value)">
            </div>
            <div class="form-group">
                <label>Brightness <span id="brightness-value">200</span></label>
                <input type="range" id="brightness" min="0" max="255" value="200"
                    oninput="updateVal('brightness')"
                    onmouseup="liftSet('brightness', this.value)"
                    ontouchend="liftSet('brightness', this.value)">
            </div>
        </div>

        <!-- Action buttons -->
        <div class="section">
            <h2>Controls</h2>
            <div class="action-row">
                <button class="btn" onclick="sendCommand('toggle')">Toggle On/Off</button>
                <button class="btn warn" onclick="sendCommand('fadeout')">Fade Out</button>
                <button class="btn danger" onclick="sendCommand('malfunction')">Malfunction</button>
            </div>
        </div>

        <!-- Advanced (collapsible) -->
        <div class="section">
            <details>
                <summary>Advanced Settings</summary>
                <div class="advanced-grid">
                    <div class="form-group">
                        <label>Speed <span id="speed-value">5</span></label>
                        <input type="range" id="speed" min="0" max="100" value="5"
                            oninput="updateVal('speed')"
                            onmouseup="liftSet('speed', this.value)"
                            ontouchend="liftSet('speed', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Packet Width <span id="width-value">8</span></label>
                        <input type="range" id="width" min="1" max="100" value="8"
                            oninput="updateVal('width')"
                            onmouseup="liftSet('width', this.value)"
                            ontouchend="liftSet('width', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Packet Spacing <span id="spacing-value">15</span></label>
                        <input type="range" id="spacing" min="0" max="756" value="15"
                            oninput="updateVal('spacing')"
                            onmouseup="liftSet('spacing', this.value)"
                            ontouchend="liftSet('spacing', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Pulse Min Brightness <span id="pulseMin-value">30</span></label>
                        <input type="range" id="pulseMin" min="0" max="255" value="30"
                            oninput="updateVal('pulseMin')"
                            onmouseup="liftSet('pulseMin', this.value)"
                            ontouchend="liftSet('pulseMin', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Pulse Max Brightness <span id="pulseMax-value">255</span></label>
                        <input type="range" id="pulseMax" min="0" max="255" value="255"
                            oninput="updateVal('pulseMax')"
                            onmouseup="liftSet('pulseMax', this.value)"
                            ontouchend="liftSet('pulseMax', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Pulse Speed <span id="pulseSpeed-value">3</span></label>
                        <input type="range" id="pulseSpeed" min="0" max="100" value="3"
                            oninput="updateVal('pulseSpeed')"
                            onmouseup="liftSet('pulseSpeed', this.value)"
                            ontouchend="liftSet('pulseSpeed', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Skip Start (LEDs) <span id="skipStart-value">0</span></label>
                        <input type="range" id="skipStart" min="0" max="378" value="0"
                            oninput="updateVal('skipStart')"
                            onmouseup="liftSet('skipStart', this.value)"
                            ontouchend="liftSet('skipStart', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Skip Middle (U-bend LEDs) <span id="skipMiddle-value">0</span></label>
                        <input type="range" id="skipMiddle" min="0" max="756" value="0"
                            oninput="updateVal('skipMiddle')"
                            onmouseup="liftSet('skipMiddle', this.value)"
                            ontouchend="liftSet('skipMiddle', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Skip End (LEDs) <span id="skipEnd-value">0</span></label>
                        <input type="range" id="skipEnd" min="0" max="378" value="0"
                            oninput="updateVal('skipEnd')"
                            onmouseup="liftSet('skipEnd', this.value)"
                            ontouchend="liftSet('skipEnd', this.value)">
                    </div>
                </div>
            </details>
        </div>
    </div><!-- /main tab -->

    <!-- STATUS TAB -->
    <div id="status" class="tab-content">
        <div class="status-box">
            <h2 style="color:#4CAF50;font-size:1em;text-transform:uppercase;letter-spacing:.05em">System Status</h2>
            <div id="status-content"><p>Loading...</p></div>
            <button class="btn" style="margin-top:10px" onclick="fetchStatus()">Refresh</button>
        </div>
    </div>

    <div class="footer">Turbolift Controller</div>
</div>

<script>
let baseURL = window.location.origin;

// Restore saved IP
const savedIP = localStorage.getItem('deviceIP') || '';
document.getElementById('device-ip').value = savedIP;
if (savedIP) {
    baseURL = 'http://' + savedIP;
    document.getElementById('server-status').textContent = 'Connected to ' + savedIP;
} else if (window.location.protocol !== 'http:') {
    document.getElementById('server-status').textContent = 'Set device IP to connect';
}

function setServer() {
    const ip = document.getElementById('device-ip').value.trim();
    if (ip) {
        localStorage.setItem('deviceIP', ip);
        baseURL = 'http://' + ip;
        document.getElementById('server-status').textContent = 'Connected to ' + ip;
        showMessage('Connecting to ' + ip + '...');
    } else {
        localStorage.removeItem('deviceIP');
        baseURL = window.location.origin;
        document.getElementById('server-status').textContent = 'Using current origin';
        showMessage('Using device origin');
    }
    fetchConfig();
}

function showTab(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.tab-button').forEach(b => {
        if (b.onclick && b.onclick.toString().includes(id)) b.classList.add('active');
    });
    if (id === 'status') fetchStatus();
}

function updateVal(id) {
    const el = document.getElementById(id);
    const span = document.getElementById(id + '-value');
    if (span) span.textContent = el.value;
}

// Map slider IDs to endpoint param names
const liftEndpoints = {
    hue:         '/set_lift_hue?hue=',
    saturation:  '/set_lift_saturation?saturation=',
    brightness:  '/set_lift_brightness?brightness=',
    speed:       '/set_lift_speed?speed=',
    width:       '/set_lift_width?width=',
    spacing:     '/set_lift_spacing?spacing=',
    pulseMin:    '/set_lift_pulse_min?value=',
    pulseMax:    '/set_lift_pulse_max?value=',
    pulseSpeed:  '/set_lift_pulse_speed?value=',
    skipStart:   '/set_lift_skip_start?count=',
    skipMiddle:  '/set_lift_skip_middle?count=',
    skipEnd:     '/set_lift_skip_end?count=',
};

function liftSet(param, value) {
    const ep = liftEndpoints[param];
    if (!ep) return;
    fetch(baseURL + ep + value)
        .then(r => r.text())
        .then(() => {})
        .catch(e => showMessage('Error: ' + e, true));
}

// Preset default values
const presetDefaults = {
    0: { speed: 6, width: 10, spacing: 18 }, // Moving Down
    1: { speed: 6, width: 10, spacing: 18 }, // Moving Up
    2: { speed: 0, width: 10, spacing: 18 }, // Stopped
    3: { speed: 0, width: 10, spacing: 18 }, // Pulse
};

function setPreset(submode) {
    // Update button highlight
    for (let i = 0; i < 4; i++) {
        document.getElementById('preset-' + i).classList.toggle('active', i === submode);
    }

    // Apply defaults for this preset
    const defaults = presetDefaults[submode];
    if (defaults) {
        for (const [k, v] of Object.entries(defaults)) {
            const el = document.getElementById(k);
            if (el) {
                el.value = v;
                updateVal(k);
                liftSet(k, v);
            }
        }
    }

    // Set sub-mode
    fetch(baseURL + '/set_lift_submode?submode=' + submode)
        .then(r => r.text())
        .then(() => showMessage('Preset set'))
        .catch(e => showMessage('Error: ' + e, true));
}

function sendCommand(endpoint) {
    fetch(baseURL + '/' + endpoint)
        .then(r => r.text())
        .then(d => showMessage(d))
        .catch(e => showMessage('Error: ' + e, true));
}

function showMessage(msg, isError = false) {
    const el = document.getElementById('message');
    el.textContent = msg;
    el.style.background = isError ? '#f44336' : '#4CAF50';
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

function fetchStatus() {
    fetch(baseURL + '/status')
        .then(r => r.text())
        .then(d => { document.getElementById('status-content').innerHTML = '<pre>' + d + '</pre>'; })
        .catch(e => { document.getElementById('status-content').innerHTML = '<p>Error: ' + e + '</p>'; });
}

function fetchConfig() {
    fetch(baseURL + '/config')
        .then(r => r.json())
        .then(d => {
            const set = (id, val) => {
                const el = document.getElementById(id);
                if (el && val !== undefined) {
                    el.value = val;
                    updateVal(id);
                }
            };
            set('hue',        d.liftHue);
            set('saturation', d.liftSaturation);
            set('brightness', d.liftBrightness);
            set('speed',      d.liftSpeed);
            set('width',      d.liftWidth);
            set('spacing',    d.liftSpacing);
            set('pulseMin',   d.liftPulseMin);
            set('pulseMax',   d.liftPulseMax);
            set('pulseSpeed', d.liftPulseSpeed);
            set('skipStart',  d.liftSkipStart);
            set('skipMiddle', d.liftSkipMiddle);
            set('skipEnd',    d.liftSkipEnd);

            // Highlight active preset
            const sub = d.liftSubmode || 0;
            for (let i = 0; i < 4; i++)
                document.getElementById('preset-' + i).classList.toggle('active', i === sub);

            updateHuePreview();
        })
        .catch(e => console.error('Config load failed:', e));
}

// Hue preview gradient
function updateHuePreview() {
    const canvas = document.getElementById('hue-preview');
    const ctx = canvas.getContext('2d');
    const hue = parseInt(document.getElementById('hue').value);
    canvas.width = canvas.offsetWidth || 300;
    const w = canvas.width, h = canvas.height || 20;
    // Draw full hue spectrum with marker at current hue
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    for (let i = 0; i <= 10; i++) {
        // FastLED hue 0-255 maps to HSL hue 0-360
        const h360 = (i / 10 * 255) / 255 * 360;
        grad.addColorStop(i / 10, 'hsl(' + h360 + ',100%,50%)');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    // Draw marker
    const x = Math.round(hue / 255 * w);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
}

// Init
updateHuePreview();
fetchConfig();
</script>
</body>
</html>
